services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: college_companion
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:yourpassword@db:5432/college_companion
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/chroma_db

  frontend:
    build: ./frontend_fixed
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata: